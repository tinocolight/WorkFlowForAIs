name: After each merge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: after-merge
  cancel-in-progress: false

jobs:
  after-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write each STATUS.md and the index in README.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/collector.py --write
          if git diff --quiet; then echo "The generated files are current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Update the generated status files"
          if git push origin HEAD:main; then exit 0; fi
          echo "main does not accept the push. Open a pull request instead."
          git push -f origin HEAD:bot/status
          gh pr view bot/status >/dev/null 2>&1 || gh pr create --head bot/status --base main \
            --title "Update the generated status files" --body "Merge allowed. Generated by after-merge.yml."
      - name: Create the tag and the release of each new revision; mark yanked revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/collector.py --json > "$RUNNER_TEMP/model.json"
          python3 - "$RUNNER_TEMP/model.json" "$RUNNER_TEMP" <<'PY'
          import json, os, subprocess, sys, zipfile
          model, tmp = json.load(open(sys.argv[1])), sys.argv[2]
          run = lambda *a: subprocess.run(a, capture_output=True, text=True)
          tags = set(run('git', 'tag').stdout.split())
          for wf in model:
              for t in wf['targets']:
                  for r in t['revisions']:
                      rid, path = r['id'], r['path']
                      if rid not in tags:
                          run('git', 'tag', rid, 'HEAD'); print('tag', rid, run('git', 'push', 'origin', f'refs/tags/{rid}').returncode)
                      title = f'{rid}' + (f' [YANKED: {r["yank"]["reason"]}]' if r['yank'] else '')
                      if run('gh', 'release', 'view', rid).returncode != 0:
                          z = os.path.join(tmp, rid.replace('/', '-') + '.zip')
                          with zipfile.ZipFile(z, 'w', zipfile.ZIP_DEFLATED) as out:
                              for base, _, files in os.walk(os.path.join(path, 'kit')):
                                  for f in files:
                                      out.write(os.path.join(base, f), os.path.relpath(os.path.join(base, f), os.path.join(path, 'kit')))
                              out.write(os.path.join(path, 'README.md'), 'WORKFLOW-REVISION.md')
                          print('release', rid, run('gh', 'release', 'create', rid, '--title', title, '--notes-file', os.path.join(path, 'README.md'), z).returncode)
                      elif r['yank']:
                          print('yanked', rid, run('gh', 'release', 'edit', rid, '--title', title).returncode)
          PY
