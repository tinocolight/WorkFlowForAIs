name: Collector checks

on:
  pull_request:
  push:

jobs:
  collector-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the base commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git hash-object -t tree /dev/null)"   # the empty tree: the first push
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
      - name: Closed revisions and evaluations do not change
        run: bash .github/scripts/check-closed.sh "$BASE"
      - name: Evaluations, stages, and generated files
        run: python3 .github/scripts/evaluations.py --check --base "$BASE"
